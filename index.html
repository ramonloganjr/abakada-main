  <!-- Inline boot loader — shown immediately while main JS bundle loads.
       Replaced by React when it mounts into #root. Kept tiny and self-contained
       so the brand mark renders with zero network round-trip. -->
  <style>
    .boot-loader {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #ffffff;
      z-index: 9999;
    }
    @media (prefers-color-scheme: dark) {
      .boot-loader { background: #0b1419; }
    }
    .boot-loader__mark {
      position: relative;
      width: 64px; height: 64px;
      display: inline-flex; align-items: center; justify-content: center;
      color: #107f87;
      animation: bootGlow 1.6s ease-in-out infinite;
    }
    .boot-loader__mark::before {
      content: ''; position: absolute; inset: -8px;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(16,127,135,0.25), transparent 70%);
      animation: bootHalo 1.6s ease-in-out infinite;
    }
    .boot-loader__mark svg { position: relative; width: 44px; height: 44px; }
    .boot-loader__sr {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    @keyframes bootGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(16,127,135,0)); opacity: 0.85; }
      50%      { transform: scale(1.06); filter: drop-shadow(0 0 14px rgba(16,127,135,0.55)); opacity: 1; }
    }
    @keyframes bootHalo {
      0%, 100% { transform: scale(0.85); opacity: 0; }
      50%      { transform: scale(1.25); opacity: 0.45; }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-loader__mark, .boot-loader__mark::before { animation: none; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="boot-loader" role="status" aria-live="polite" aria-busy="true">
      <span class="boot-loader__mark" aria-hidden="true">
        <svg viewBox="0 0 196.23 196.23" focusable="false">
          <path d="M121.1,7.39l64.72,177.65h-42.38l-10.91-31.22-10.66,31.22H9.69L74.41,7.39h46.7ZM130.49,147.99l-32.74-93.9-32.99,93.9h65.73Z" fill="currentColor"/>
        </svg>
      </span>
      <span class="boot-loader__sr">Loading Abakada</span>
    </div>
  </div>
