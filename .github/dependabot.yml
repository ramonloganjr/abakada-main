version: 2
updates:
  # Runtime + build dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk dev tooling so reviewers see one PR, not ten.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    labels:
      - dependencies

  # Keep GitHub Actions pinned and current
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
