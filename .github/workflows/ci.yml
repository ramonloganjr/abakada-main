name: CI

on:
  pull_request:
    branches: [main]
    # The hourly fetch-visitors cron now opens a PR per refresh (main is
    # PR-protected and the bot cannot bypass the ruleset), so without this
    # filter every one of those 24-a-day PRs would drag a full matrix behind
    # it. The counter is bot-written data with no bearing on the build.
    paths-ignore:
      - "public/assets/data/visitors.json"
  # Without this, CI only ever ran against a PR's merge commit and main itself
  # carried no status of its own — a merged PR kept displaying the red X from
  # its last PR run, and a merge that broke main was invisible until the next
  # PR happened to catch it.
  push:
    branches: [main]
    # Same reasoning for the squashed commit each of those PRs lands on main.
    paths-ignore:
      - "public/assets/data/visitors.json"
  workflow_dispatch:

# Cancel superseded runs on the same branch to save minutes. Pushes to main are
# excluded: each main commit needs its own durable status, so a rapid second
# merge must not cancel the run that establishes the first one's result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Validate data (JSON Schema)
        run: npm run validate:data

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Production dependency audit (fail on high+)
        run: npm audit --omit=dev --audit-level=high

      # Three engines cover all five Playwright projects: the mobile-chrome and
      # mobile-safari projects reuse the Chromium and WebKit binaries.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
