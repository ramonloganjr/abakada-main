name: Build & Deploy to cPanel

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/assets/data/visitors.json'
      - 'public/sitemap.xml'
      - '.github/workflows/fetch-visitors.yml'
      - '.github/workflows/sitemap-refresh.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy dist/ to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASS }}
          port: 21
          protocol: ftps
          security: loose
          timeout: 60000
          local-dir: ./dist/
          # IMPORTANT: The FTP account lands in the account home and the
          # document root for abakada.org is the `abakada.org/` folder, NOT
          # `public_html/` (an unserved sibling on this host). The last good
          # full deploy used `abakada.org/` and its sync-state landed at the
          # live web root, confirming this is the served directory.
          # Do NOT change this to public_html/.
          server-dir: abakada.org/

      # A 404/5xx means the deploy landed in the wrong directory (server-dir
      # regression) — HARD FAIL. A 403 is Cloudflare bot protection blocking the
      # CI runner, not a deploy failure, so warn and pass.
      - name: Verify homepage is live
        run: |
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          for attempt in 1 2 3 4 5; do
            code="$(curl -s -A "$ua" -o /dev/null -w '%{http_code}' --max-time 20 "https://abakada.org/?cb=${GITHUB_RUN_ID}-${attempt}" || echo 000)"
            echo "Attempt ${attempt}: homepage HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "OK: homepage returned 200"
              exit 0
            fi
            if [ "$code" = "404" ] || [ "$code" = "500" ] || [ "$code" = "503" ]; then
              echo "FAIL: homepage returned ${code} after deploy (wrong server-dir?)."
              exit 1
            fi
            sleep 15
          done
          echo "::warning::Could not positively confirm homepage 200 (likely Cloudflare bot protection returning 403 to the CI runner). No 404/5xx seen, so not treated as a deploy failure. Manually verify: https://abakada.org/"
          exit 0
