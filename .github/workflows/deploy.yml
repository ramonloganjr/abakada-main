name: Build & Deploy to cPanel

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/assets/data/visitors.json'
      - 'public/sitemap.xml'
      - '.github/workflows/fetch-visitors.yml'
      - '.github/workflows/sitemap-refresh.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy dist/ to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASS }}
          port: 21
          protocol: ftps
          security: loose
          local-dir: ./dist/
          server-dir: public_html/
