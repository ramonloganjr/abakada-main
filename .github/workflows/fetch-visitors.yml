name: Fetch GA4 Visitor Count

on:
  schedule:
    # Hourly so the production value never drifts more than ~1h from GA4
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-visitors:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Write GA4 fetch script
        run: |
          cat > /tmp/fetch-ga4.js << 'EOF'
          const https = require('https');
          const crypto = require('crypto');

          const key = JSON.parse(process.env.GA4_SERVICE_ACCOUNT_KEY);
          const propertyId = process.env.GA4_PROPERTY_ID;

          // Build JWT for Google OAuth2
          function base64url(str) {
            return Buffer.from(str).toString('base64')
              .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
          }

          const header = base64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
          const now = Math.floor(Date.now() / 1000);
          const claim = base64url(JSON.stringify({
            iss: key.client_email,
            scope: 'https://www.googleapis.com/auth/analytics.readonly',
            aud: 'https://oauth2.googleapis.com/token',
            exp: now + 3600,
            iat: now
          }));

          const sign = crypto.createSign('RSA-SHA256');
          sign.update(header + '.' + claim);
          const sig = sign.sign(key.private_key, 'base64')
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');

          const jwt = header + '.' + claim + '.' + sig;

          function post(url, data) {
            return new Promise((resolve, reject) => {
              const body = new URLSearchParams(data).toString();
              const u = new URL(url);
              const req = https.request({
                hostname: u.hostname,
                path: u.pathname,
                method: 'POST',
                headers: {
                  'Content-Type': 'application/x-www-form-urlencoded',
                  'Content-Length': Buffer.byteLength(body)
                }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve(JSON.parse(d)));
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          function postJson(url, token, body) {
            return new Promise((resolve, reject) => {
              const b = JSON.stringify(body);
              const u = new URL(url);
              const req = https.request({
                hostname: u.hostname,
                path: u.pathname,
                method: 'POST',
                headers: {
                  'Authorization': 'Bearer ' + token,
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(b)
                }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve(JSON.parse(d)));
              });
              req.on('error', reject);
              req.write(b);
              req.end();
            });
          }

          (async () => {
            const tokenRes = await post('https://oauth2.googleapis.com/token', {
              grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
              assertion: jwt
            });

            if (!tokenRes.access_token) {
              console.error('Token error:', JSON.stringify(tokenRes));
              process.exit(1);
            }

            const report = await postJson(
              'https://analyticsdata.googleapis.com/v1beta/properties/' + propertyId + ':runReport',
              tokenRes.access_token,
              {
                dateRanges: [{ startDate: '2020-01-01', endDate: 'today' }],
                metrics: [{ name: 'totalUsers' }]
              }
            );

            if (!report.rows) {
              console.error('Report error:', JSON.stringify(report));
              process.exit(1);
            }

            const totalUsers = parseInt(report.rows[0].metricValues[0].value, 10);
            const fs = require('fs');
            const path = 'public/assets/data/visitors.json';
            let prev = null;
            try { prev = JSON.parse(fs.readFileSync(path, 'utf8')); } catch {}
            if (prev && prev.totalUsers === totalUsers) {
              console.log('No change in totalUsers (' + totalUsers + '), skipping write/commit.');
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=false\n');
              return;
            }
            const out = JSON.stringify({ totalUsers, updatedAt: new Date().toISOString() }, null, 2);
            fs.writeFileSync(path, out);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=true\n');
            console.log('Written:', out);
          })();
          EOF

      - name: Fetch total users from GA4 (3 attempts, 30s back-off)
        id: fetch
        timeout-minutes: 5
        env:
          GA4_PROPERTY_ID: '522500658'
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
        run: |
          for attempt in 1 2 3; do
            echo "Attempt ${attempt} of 3..."
            if node /tmp/fetch-ga4.js; then
              echo "Success on attempt ${attempt}"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "Failed, retrying in 30s..."
              sleep 30
            fi
          done
          echo "All 3 attempts failed"
          exit 1

      - name: Commit and push visitors.json
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets/data/visitors.json
          # No [skip ci] marker: Vercel treats it (and [ci skip]/[no ci]) as
          # "do not deploy", which would freeze the live count at whatever the
          # last full deploy shipped. Pushing this file IS the deploy trigger now.
          # No GitHub workflow runs on push to main, so nothing else is woken up.
          git diff --staged --quiet || git commit -m "chore: update visitor count"
          git push

      # Publishing is Vercel's job: the push above triggers a production build
      # that ships the new visitors.json with the rest of dist/. The wait below
      # covers that build before the verification step reads the live URL.
      - name: Wait for the Vercel deployment to go live
        if: steps.fetch.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: sleep 150

      # Confirm the file is reachable at its public URL. /assets/* is excluded
      # from the SPA rewrite in vercel.json, so a missing file returns a real 404
      # rather than the app shell — which makes a 404 a HARD FAIL: it means the
      # Vercel build did not ship (or has not finished shipping) the new value.
      # A 403 means Cloudflare's bot protection blocked the CI runner
      # (datacenter IP) — not evidence of a missing file, so we warn and pass.
      - name: Verify visitors.json is live
        if: steps.fetch.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          for attempt in 1 2 3 4 5; do
            url="https://abakada.org/assets/data/visitors.json?cb=${GITHUB_RUN_ID}-${attempt}"
            tmp="$(mktemp)"
            code="$(curl -sS -A "$ua" -H 'Cache-Control: no-cache' -H 'Accept: application/json' \
                     -o "$tmp" -w '%{http_code}' --max-time 20 "$url" || echo 000)"
            users="$(grep -oE '"totalUsers"[[:space:]]*:[[:space:]]*[0-9]+' "$tmp" | grep -oE '[0-9]+' | head -1)"
            echo "Attempt ${attempt}: HTTP ${code} totalUsers=${users:-none}"
            if [ "$code" = "200" ] && [ -n "$users" ] && [ "$users" -gt 0 ]; then
              echo "OK: live visitors.json reports totalUsers=${users}"
              exit 0
            fi
            if [ "$code" = "404" ]; then
              echo "FAIL: HTTP 404 — visitors.json is not at the served path (server-dir regression)."
              exit 1
            fi
            sleep 15
          done
          echo "::warning::Could not positively confirm visitors.json over the public URL (likely Cloudflare bot protection returning 403 to the CI runner). No 404 was seen, so this is not treated as a deploy failure. Manually verify: https://abakada.org/assets/data/visitors.json"
          exit 0
