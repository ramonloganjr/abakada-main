name: Fetch GA4 Visitor Count

on:
  schedule:
    # Hourly so the production value never drifts more than ~1h from GA4
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-visitors:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write GA4 fetch script
        run: |
          cat > /tmp/fetch-ga4.js << 'EOF'
          const https = require('https');
          const crypto = require('crypto');

          const key = JSON.parse(process.env.GA4_SERVICE_ACCOUNT_KEY);
          const propertyId = process.env.GA4_PROPERTY_ID;

          // Build JWT for Google OAuth2
          function base64url(str) {
            return Buffer.from(str).toString('base64')
              .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
          }

          const header = base64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
          const now = Math.floor(Date.now() / 1000);
          const claim = base64url(JSON.stringify({
            iss: key.client_email,
            scope: 'https://www.googleapis.com/auth/analytics.readonly',
            aud: 'https://oauth2.googleapis.com/token',
            exp: now + 3600,
            iat: now
          }));

          const sign = crypto.createSign('RSA-SHA256');
          sign.update(header + '.' + claim);
          const sig = sign.sign(key.private_key, 'base64')
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');

          const jwt = header + '.' + claim + '.' + sig;

          function post(url, data) {
            return new Promise((resolve, reject) => {
              const body = new URLSearchParams(data).toString();
              const u = new URL(url);
              const req = https.request({
                hostname: u.hostname,
                path: u.pathname,
                method: 'POST',
                headers: {
                  'Content-Type': 'application/x-www-form-urlencoded',
                  'Content-Length': Buffer.byteLength(body)
                }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve(JSON.parse(d)));
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          function postJson(url, token, body) {
            return new Promise((resolve, reject) => {
              const b = JSON.stringify(body);
              const u = new URL(url);
              const req = https.request({
                hostname: u.hostname,
                path: u.pathname,
                method: 'POST',
                headers: {
                  'Authorization': 'Bearer ' + token,
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(b)
                }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve(JSON.parse(d)));
              });
              req.on('error', reject);
              req.write(b);
              req.end();
            });
          }

          (async () => {
            const tokenRes = await post('https://oauth2.googleapis.com/token', {
              grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
              assertion: jwt
            });

            if (!tokenRes.access_token) {
              console.error('Token error:', JSON.stringify(tokenRes));
              process.exit(1);
            }

            const report = await postJson(
              'https://analyticsdata.googleapis.com/v1beta/properties/' + propertyId + ':runReport',
              tokenRes.access_token,
              {
                dateRanges: [{ startDate: '2020-01-01', endDate: 'today' }],
                metrics: [{ name: 'totalUsers' }]
              }
            );

            if (!report.rows) {
              console.error('Report error:', JSON.stringify(report));
              process.exit(1);
            }

            const totalUsers = parseInt(report.rows[0].metricValues[0].value, 10);
            const fs = require('fs');
            const path = 'public/assets/data/visitors.json';
            let prev = null;
            try { prev = JSON.parse(fs.readFileSync(path, 'utf8')); } catch {}
            if (prev && prev.totalUsers === totalUsers) {
              console.log('No change in totalUsers (' + totalUsers + '), skipping write/commit.');
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=false\n');
              return;
            }
            const out = JSON.stringify({ totalUsers, updatedAt: new Date().toISOString() }, null, 2);
            fs.writeFileSync(path, out);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=true\n');
            console.log('Written:', out);
          })();
          EOF

      - name: Fetch total users from GA4 (3 attempts, 30s back-off)
        id: fetch
        timeout-minutes: 5
        env:
          GA4_PROPERTY_ID: '522500658'
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
        run: |
          for attempt in 1 2 3; do
            echo "Attempt ${attempt} of 3..."
            if node /tmp/fetch-ga4.js; then
              echo "Success on attempt ${attempt}"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "Failed, retrying in 30s..."
              sleep 30
            fi
          done
          echo "All 3 attempts failed"
          exit 1

      - name: Commit and push visitors.json
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets/data/visitors.json
          git diff --staged --quiet || git commit -m "chore: update visitor count [skip ci]"
          git push

      - name: Deploy visitors.json to cPanel via FTP
        if: steps.fetch.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASS }}
          port: 21
          protocol: ftps
          security: loose
          timeout: 60000
          local-dir: ./public/assets/data/
          # IMPORTANT: The FTP account lands in the account home and the
          # document root for abakada.org is the `abakada.org/` folder, NOT
          # `public_html/` (which is an unserved sibling directory on this host).
          # Do NOT "correct" this to public_html/ — doing so uploads to a path
          # that is never served, returning 404 and hiding the visitor badge.
          # Verified via the live .ftp-deploy-sync-state.json at the web root.
          server-dir: abakada.org/assets/data/
          exclude: |
            **
            !visitors.json

      # Fail loudly if the file is not actually reachable at the public URL.
      # This turns a silent wrong-path deploy (the exact bug this fixes) into a
      # red build instead of an invisible 404.
      - name: Verify visitors.json is live
        if: steps.fetch.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          url="https://abakada.org/assets/data/visitors.json?cb=${GITHUB_RUN_ID}"
          echo "Verifying ${url}"
          for attempt in 1 2 3 4 5; do
            body="$(curl -fsSL -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' --max-time 20 "$url" || true)"
            users="$(printf '%s' "$body" | grep -oE '"totalUsers"[[:space:]]*:[[:space:]]*[0-9]+' | grep -oE '[0-9]+' || true)"
            if [ -n "$users" ] && [ "$users" -gt 0 ] 2>/dev/null; then
              echo "OK: live visitors.json reports totalUsers=${users}"
              exit 0
            fi
            echo "Attempt ${attempt}: not live yet (FTP/propagation), retrying in 15s..."
            sleep 15
          done
          echo "ERROR: visitors.json did not become reachable with a positive totalUsers."
          exit 1
