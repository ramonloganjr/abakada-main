name: Refresh sitemap

on:
  schedule:
    # Quarterly (1st of Jan, Apr, Jul, Oct at 06:00 UTC)
    - cron: '0 6 1 1,4,7,10 *'
  push:
    branches: [main]
    paths:
      - 'public/assets/data/tools.json'
      - 'public/assets/data/learning-paths.json'
      - 'scripts/refresh-sitemap.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate sitemap.xml
        run: node scripts/refresh-sitemap.js

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain public/sitemap.xml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/sitemap.xml
            git commit -m "chore: refresh sitemap.xml [skip ci]"
            git push
          else
            echo "No sitemap changes."
          fi
